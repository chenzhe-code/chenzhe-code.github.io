short_bio: >-
  <p>
    I am currently a Ph.D student at <a href="https://liesmars.whu.edu.cn/">LIESMARS</a>, <a href="https://en.whu.edu.cn/">Wuhan University</a>, under the supervision of Prof. <a href="http://3s.whu.edu.cn/ybs/index.htm">Bisheng Yang</a>  and Prof. <a href="https://dongzhenwhu.github.io/index.html">Zhen Dong</a>.
    Previously, I received the B.S. degree from the <a href="https://dxy.hhu.edu.cn/">School of Earth Sciences and Engineering</a>, <a href="https://www.hhu.edu.cn/">Hohai University</a>, in 2020.
  </p>
  <p>
    My research focuses on 3D urban morphology, encompassing understanding, reconstruction, utilization of urban elements through multi-source remote sensing data.
  </p>

